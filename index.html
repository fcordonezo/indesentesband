<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="author" content="INDESENTES" />
    <meta name="application-name" content="INDESENTES" />
    <meta name="theme-color" content="#090909" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="INDESENTES es una banda de punk rock y rock alternativo de Bogotá, Colombia. Escucha nuestra música, conoce los próximos eventos y contáctanos para agendar el tuyo."
    />
    <meta name="keywords" content="INDESENTES, punk rock, rock alternativo, banda de Bogotá, rock colombiano, música en español, conciertos Bogotá, eventos de rock" />
    <link rel="canonical" href="https://indesentesband.com/" />
    <link rel="alternate" hreflang="es-CO" href="https://indesentesband.com/" />
    <link rel="alternate" hreflang="x-default" href="https://indesentesband.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="INDESENTES" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:url" content="https://indesentesband.com/" />
    <meta property="og:title" content="INDESENTES | Punk rock desde Bogotá" />
    <meta property="og:description" content="Escucha la música de INDESENTES, descubre nuestros eventos y conecta con la banda de punk rock y rock alternativo de Bogotá." />
    <meta property="og:image" content="https://indesentesband.com/assets/logo-dark.webp" />
    <meta property="og:image:secure_url" content="https://indesentesband.com/assets/logo-dark.webp" />
    <meta property="og:image:alt" content="Logo de INDESENTES" />
    <meta property="og:image:type" content="image/webp" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@indesentesband" />
    <meta name="twitter:title" content="INDESENTES | Punk rock desde Bogotá" />
    <meta name="twitter:description" content="Música, eventos y contacto de INDESENTES, banda de punk rock y rock alternativo de Bogotá." />
    <meta name="twitter:image" content="https://indesentesband.com/assets/logo-dark.webp" />
    <meta name="twitter:image:alt" content="Logo de INDESENTES" />

    <title>INDESENTES | Punk rock desde Bogotá</title>
    <link rel="stylesheet" href="styles.css" />
    <script defer src="app.js"></script>
    <link rel="icon" type="image/webp" href="assets/ico.webp" />
    <link rel="apple-touch-icon" href="assets/ico.webp" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "MusicGroup",
        "@id": "https://indesentesband.com/#organization",
        "name": "INDESENTES",
        "url": "https://indesentesband.com/",
        "description": "Banda de punk rock y rock alternativo de Bogotá, Colombia.",
        "genre": ["Punk rock", "Rock alternativo", "Rock en español"],
        "foundingLocation": {
          "@type": "Place",
          "name": "Bogotá, Colombia"
        },
        "logo": "https://indesentesband.com/assets/logo-dark.webp",
        "image": "https://indesentesband.com/assets/logo-dark.webp",
        "sameAs": [
          "https://www.instagram.com/indesentesband/",
          "https://www.facebook.com/indesentespr/"
        ]
      }
    </script>
  </head>
  <body>
    <div class="page-shell">
      <button
        id="theme-toggle"
        class="theme-toggle"
        type="button"
        aria-label="Cambiar tema"
        title="Cambiar tema"
      >
        <span id="theme-icon" aria-hidden="true">☀</span>
      </button>

      <header class="site-header" id="site-header">
        <div class="brand-mark">
          <img id="brand-logo" src="assets/logo-dark.webp" alt="Logo INDESENTES" width="300" height="300" fetchpriority="high" decoding="async" />
        </div>
        <div class="brand-copy">
          <p class="eyebrow">PUNK ROCK</p>
          <h1 id="site-title">INDESENTES</h1>
          <p id="site-tagline" class="tagline"></p>
          <div id="social-links" class="social-links" aria-label="Redes sociales"></div>
        </div>
      </header>

      <nav class="main-nav" aria-label="Navegación principal">
        <div class="nav-shell">
          <ul id="nav-menu" class="nav-menu"></ul>
        </div>
      </nav>

      <main id="page-content" class="page-content" aria-live="polite"></main>

      <footer class="site-footer" id="site-footer"></footer>
    </div>

    <div id="image-modal" class="image-modal" role="dialog" aria-modal="true" aria-labelledby="image-modal-title" hidden>
      <div class="image-modal-backdrop" data-image-modal-close></div>
      <div class="image-modal-content">
        <div class="image-modal-toolbar">
          <h2 id="image-modal-title">Vista previa del flyer</h2>
          <button type="button" class="image-modal-close" data-image-modal-close aria-label="Cerrar imagen" title="Cerrar imagen">×</button>
        </div>
        <img id="image-modal-preview" src="" alt="" />
      </div>
    </div>
  </body>
</html>
